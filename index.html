<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06283c"><title>Imperial Ambitions · Playtest</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="battle-view.css"><link rel="stylesheet" href="royal.css"><link rel="stylesheet" href="menu-theme.css"><link rel="stylesheet" href="visual-craft.css"><link rel="manifest" href="manifest.webmanifest"></head>
